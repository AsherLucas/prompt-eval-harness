# Publish to PyPI on version tags, via Trusted Publishing (OIDC).
#
# ACCOUNT-OWNER STEPS REQUIRED BEFORE THIS CAN RUN (not done by code):
# 1. Create a PyPI account and enable 2FA on it.
# 2. On PyPI, register a pending Trusted Publisher for this repo and
#    this workflow (owner/repo, workflow name "publish.yml",
#    environment optional). No long-lived token is stored in the repo.
# 3. Tag a release (git tag v0.2.0 && git push --tags); the tag
#    triggers this workflow. The version in pyproject.toml must match.
name: Publish to PyPI
on:
  push:
    tags: ["v*"]
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
