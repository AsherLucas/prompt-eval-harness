# Code generation / structured-output example cases — all pass
# offline with --provider stub. These cases cover json_schema,
# regex, and exact: the checks that matter most when a model must
# emit parseable, well-shaped output. Each case's stub_output is
# the canned output the stub provider returns. In real use, remove
# stub_output and use --provider openai so outputs come from a
# real model, not from this file.
version: 1
cases:
  - id: codegen-json-function
    prompt: "Describe an add function as JSON with name, params, and returns"
    stub_output: '{"name": "add", "params": ["a", "b"], "returns": "int"}'
    expected:
      - type: json_schema
        schema:
          type: object
          required: [name, params, returns]
          properties:
            name: {type: string}
            params:
              type: array
              items: {type: string}
              minItems: 2
            returns: {type: string}
  - id: codegen-json-error
    prompt: "Return an error object as JSON with a known error code"
    stub_output: '{"error": "NOT_FOUND", "code": 404}'
    expected:
      - type: json_schema
        schema:
          type: object
          required: [error, code]
          properties:
            error: {type: string, enum: [NOT_FOUND, TIMEOUT, INVALID]}
            code: {type: integer, minimum: 100, maximum: 599}
  - id: codegen-json-array
    prompt: "Return four integers as a JSON array"
    stub_output: "[1, 2, 3, 4]"
    expected:
      - type: json_schema
        schema:
          type: array
          items: {type: integer}
          minItems: 3
          maxItems: 10
  - id: codegen-regex-version
    prompt: "Announce a semantic version"
    stub_output: "Version 1.2.3 released"
    expected:
      - type: regex
        pattern: '\d+\.\d+\.\d+'
  - id: codegen-regex-error-code
    prompt: "Return an error code like E1234"
    stub_output: "Error code: E5678"
    expected:
      - type: regex
        pattern: 'E\d{4}'
  - id: codegen-regex-function-def
    prompt: "Write a Python function definition for add"
    stub_output: "def add(a, b):"
    expected:
      - type: regex
        pattern: '^def \w+\('
  - id: codegen-exact-snippet
    prompt: "Print hello exactly, with no extra text"
    stub_output: "print('hello')"
    expected:
      - type: exact
        value: "print('hello')"
  - id: codegen-exact-json
    prompt: "Return exactly this JSON object, with no extra text"
    stub_output: '{"ok": true}'
    expected:
      - type: exact
        value: '{"ok": true}'
  - id: codegen-json-nested
    prompt: "Return a user object as JSON with name, age, and an active flag"
    stub_output: '{"user": {"name": "Ada", "age": 36}, "active": true}'
    expected:
      - type: json_schema
        schema:
          type: object
          required: [user, active]
          properties:
            user:
              type: object
              required: [name, age]
              properties:
                name: {type: string}
                age: {type: integer, minimum: 0}
            active: {type: boolean}
  - id: codegen-json-version-regex
    prompt: "Return a semantic version as JSON"
    stub_output: '{"version": "2.0.1"}'
    expected:
      - type: json_schema
        schema:
          type: object
          required: [version]
          properties:
            version: {type: string, pattern: '^\d+\.\d+\.\d+$'}
      - type: regex
        pattern: '2\.0\.1'
