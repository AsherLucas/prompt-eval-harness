# Golden example cases — all 30 pass offline with --provider stub.
# Each case's stub_output is the canned output the stub provider returns.
# In real use, remove stub_output and use --provider openai (or your own
# provider) so outputs come from a real model, not from this file.
version: 1
cases:
  - id: exact-greeting
    prompt: "Say hello"
    stub_output: "Hello, world!"
    expected:
      - type: exact
        value: "Hello, world!"
  - id: exact-case-insensitive
    prompt: "Answer yes or no"
    stub_output: "YES"
    expected:
      - type: exact
        value: "yes"
        case_sensitive: false
  - id: regex-email
    prompt: "Give a contact email"
    stub_output: "Contact us at team@example.com for help."
    expected:
      - type: regex
        pattern: "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
  - id: regex-date
    prompt: "Give the release date"
    stub_output: "The release date is 2026-03-15."
    expected:
      - type: regex
        pattern: "\\d{4}-\\d{2}-\\d{2}"
  - id: json-object
    prompt: "Return a person as JSON"
    stub_output: '{"name": "Ada", "age": 36}'
    expected:
      - type: json_schema
        schema:
          type: object
          required: [name, age]
          properties:
            name: {type: string}
            age: {type: integer, minimum: 0}
  - id: json-array
    prompt: "Return three numbers as JSON"
    stub_output: "[1, 2, 3]"
    expected:
      - type: json_schema
        schema:
          type: array
          items: {type: integer}
          minItems: 2
  - id: json-enum
    prompt: "Return a status as JSON"
    stub_output: '{"status": "done"}'
    expected:
      - type: json_schema
        schema:
          type: object
          required: [status]
          properties:
            status: {type: string, enum: [pending, done, failed]}
  - id: length-chars
    prompt: "Write a sentence"
    stub_output: "This sentence is long enough."
    expected:
      - type: length
        min_length: 10
        max_length: 100
  - id: length-words
    prompt: "List five words"
    stub_output: "one two three four five"
    expected:
      - type: length
        min_words: 4
        max_words: 10
  - id: format-json
    prompt: "Return JSON"
    stub_output: '{"ok": true}'
    expected:
      - type: format
        kind: json
  - id: format-email
    prompt: "Return only an email address"
    stub_output: "ada@example.org"
    expected:
      - type: format
        kind: email
  - id: format-url
    prompt: "Return only a docs URL"
    stub_output: "https://example.com/docs"
    expected:
      - type: format
        kind: url
  - id: contains-all
    prompt: "Write a sentence about a fox"
    stub_output: "The quick brown fox jumps."
    expected:
      - type: contains_all
        strings: [quick, brown, fox]
  - id: contains-case-insensitive
    prompt: "Say hello"
    stub_output: "Hello WORLD"
    expected:
      - type: contains_all
        strings: [hello]
        case_sensitive: false
  - id: citation-one
    prompt: "Explain photosynthesis with a citation"
    stub_output: "Photosynthesis converts light into energy [1]."
    expected:
      - type: citation
        min_citations: 1
  - id: citation-two
    prompt: "Make two cited claims"
    stub_output: "Claim A [1] and claim B [2]."
    expected:
      - type: citation
        min_citations: 2
  - id: citation-source
    prompt: "Cite the user guide"
    stub_output: "See the manual [source: user-guide] for details."
    expected:
      - type: citation
        min_citations: 1
        required_sources: [user-guide]
  - id: exact-json-string
    prompt: "Return exactly this JSON"
    stub_output: '{"a": 1}'
    expected:
      - type: exact
        value: '{"a": 1}'
  - id: regex-code
    prompt: "Return an error code"
    stub_output: "Error code: E1234"
    expected:
      - type: regex
        pattern: "E\\d{4}"
  - id: length-exact-range
    prompt: "Return exactly ten characters"
    stub_output: "1234567890"
    expected:
      - type: length
        min_length: 10
        max_length: 10
  - id: format-lowercase
    prompt: "Return lowercase words only"
    stub_output: "all lowercase words here"
    expected:
      - type: format
        kind: lowercase
  - id: format-uppercase
    prompt: "Return uppercase words only"
    stub_output: "ALL CAPS HERE"
    expected:
      - type: format
        kind: uppercase
  - id: json-number-range
    prompt: "Return a score between 0 and 1 as JSON"
    stub_output: '{"score": 0.85}'
    expected:
      - type: json_schema
        schema:
          type: object
          required: [score]
          properties:
            score: {type: number, minimum: 0, maximum: 1}
  - id: json-string-pattern
    prompt: "Return a code like AB123 as JSON"
    stub_output: '{"code": "AB123"}'
    expected:
      - type: json_schema
        schema:
          type: object
          required: [code]
          properties:
            code: {type: string, minLength: 5, pattern: "^[A-Z]{2}\\d{3}$"}
  - id: combined-contains-length
    prompt: "Write about Python testing"
    stub_output: "Python is great for data work and testing."
    expected:
      - type: contains_all
        strings: [Python, testing]
      - type: length
        min_words: 5
  - id: combined-regex-length
    prompt: "Announce a version"
    stub_output: "Version 2.4.1 released today"
    expected:
      - type: regex
        pattern: "\\d+\\.\\d+\\.\\d+"
      - type: length
        max_length: 50
  - id: json-boolean
    prompt: "Return a flag as JSON"
    stub_output: '{"enabled": true}'
    expected:
      - type: json_schema
        schema:
          type: object
          required: [enabled]
          properties:
            enabled: {type: boolean}
  - id: combined-json-format-schema
    prompt: "Return a title and count as JSON"
    stub_output: '{"title": "Hello", "count": 3}'
    expected:
      - type: format
        kind: json
      - type: json_schema
        schema:
          type: object
          required: [title, count]
          properties:
            title: {type: string}
            count: {type: integer}
  - id: citation-contains
    prompt: "Explain setup with a citation"
    stub_output: "The guide [1] explains setup and install steps."
    expected:
      - type: citation
        min_citations: 1
      - type: contains_all
        strings: [setup, install]
  - id: exact-strip
    prompt: "Return the word padded"
    stub_output: "  padded  "
    expected:
      - type: exact
        value: "padded"
        strip: true
